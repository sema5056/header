<!DOCTYPE html>
<html>
  <head>
    <style>
      .container{
        display:flex;
        justify-content:space-between;
        width:100%;
        max-width: 1100px;
        margin: 0 auto;
        align-items:center;
      }
      ul{
        display:flex;
        list-style:none;
        margin:0;
        padding:0;
        justify-content: center;
      }
      li{
        margin-left:20px;
      }
      a{
        color:darkblue;
        text-decoration: none;}
      a:hover{
        color:red;
      }
      .header{
        padding:10px 0;
      }
      .active{
        color:red;
        font-weight:bold;
        border-bottom:2px solid red;
      }
      @media(max-width:750px){
        .container{
          flex-direction:column;
          margin: 0 auto;
        }
        .menu{
        margin-top:10px;
      }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="#" class="logo">LOGO</a>
        <nav class="menu">
          <ul>
            <li>
              <a href="#" class="active">Main</a></li>
            <li>
              <a href="#">About us</a></li>
            <li>
              <a href="#">Instagram</a></li>
            <li>
              <a href="#">Telegram</a></li>
            <li>
              <a href="#">2GIS</a></li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
